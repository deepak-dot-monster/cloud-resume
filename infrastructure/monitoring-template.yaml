AWSTemplateFormatVersion: '2010-09-09'
Description: Cloud Resume Challenge - Monitoring and Alerts

Parameters:
  AlertEmail:
    Type: String
    Description: Email address to receive alerts

Resources:

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloud-resume-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: visitor-count-lambda-errors
      AlarmDescription: Triggers when the visitor count Lambda has errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: visitor-count-function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: monthly-billing-alarm
      AlarmDescription: Triggers if estimated monthly AWS charges exceed $5
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic